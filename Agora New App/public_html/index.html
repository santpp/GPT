<style id="ag-entrada-css">
/* 2.18.9 · Pantalla de entrada (ver el comentario junto al marcado) */
#ag-entrada{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,18px);pointer-events:auto}
#ag-entrada .age-fondo{position:absolute;inset:0;background:var(--bg,#F5F5F7);z-index:-1}
#ag-entrada .age-mitad{display:flex;align-items:center}
#ag-entrada svg{display:block;height:clamp(46px,9vw,84px);width:auto;overflow:visible}
#ag-entrada .age-iso .age-aro{fill:#AD103C;transform-origin:50% 50%;transform-box:fill-box;animation:age-iso .7s cubic-bezier(.22,1,.36,1) both}
#ag-entrada .age-iso .age-rayo{fill:#AD103C;transform-origin:50% 50%;transform-box:fill-box;animation:age-rayo .6s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.12s + var(--i) * .08s)}
#ag-entrada .age-linea{position:absolute;left:50%;top:calc(50% + clamp(46px,9vw,84px) / 2 + 22px);width:clamp(120px,18vw,200px);height:2px;margin-left:calc(clamp(120px,18vw,200px) / -2);border-radius:2px;background:color-mix(in srgb,var(--ink,#1D1D1F) 10%,transparent);overflow:hidden;opacity:0;animation:age-aparece .3s ease .7s forwards}
#ag-entrada .age-linea::after{content:"";position:absolute;inset:0;width:34%;border-radius:2px;background:#AD103C;animation:age-va 1.1s cubic-bezier(.65,0,.35,1) infinite}
#ag-entrada.is-sale{pointer-events:none}
#ag-entrada.is-sale .age-linea{opacity:0!important;transition:opacity .15s}
#ag-entrada.is-sale :is(path,polygon){animation:none!important}
@keyframes age-iso{from{opacity:0;transform:scale(.82) rotate(-18deg)}to{opacity:1;transform:none}}
@keyframes age-rayo{from{opacity:0;transform:rotate(-90deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes age-aparece{to{opacity:1}}
@keyframes age-va{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
@media (prefers-reduced-motion:reduce){#ag-entrada *{animation:none!important}}

<!-- 2.18.8–2.19.0 · Entrada (pedido del usuario): al entrar o recargar, el símbolo de Ágora (sin el nombre, 2.19.0) aparece pieza por pieza mientras la app termina de cargar.
     Al estar lista, cada pieza (aro y los dos rayos de la estrella) vuela a su misma pieza del logo que se ve en pantalla (arriba en la app, en la cabecera
     al entrar) y encaja ahí. Dos salidas: antes de iniciar sesión el fondo se desvanece; después (y al recargar) el fondo se recoge hacia el logo. -->
<div id="ag-entrada" aria-hidden="true"><div class="age-fondo"></div><div class="age-mitad age-izq"><svg class="age-iso" viewBox="0 0 534 592"><path class="age-aro" style="--i:0" d="M267.09,0C128.79,0,16.67,111.74,16.67,249.59v92.72c0,137.84,112.12,249.59,250.42,249.59s250.42-111.74,250.42-249.59v-92.72c0-68.92-28.02-131.32-73.34-176.49C398.84,27.93,336.24,0,267.09,0ZM472.38,341.81c0,113.01-91.91,204.61-205.29,204.61S61.8,454.82,61.8,341.81v-91.73c0-112.99,91.91-204.61,205.29-204.61,56.69,0,108.01,22.91,145.17,59.94,37.14,37.02,60.12,88.18,60.12,144.67v91.73Z"/><polygon class="age-rayo" style="--i:1" points="107.44 363.83 212.07 363.83 138.08 437.58 170.34 469.73 244.33 395.99 244.33 500.28 289.96 500.28 289.96 395.99 363.95 469.73 396.21 437.58 322.22 363.83 426.85 363.83 426.85 318.36 107.44 318.36 107.44 363.83"/><polygon class="age-rayo" style="--i:2" points="396.21 153.66 363.95 121.5 289.96 195.24 289.96 90.96 244.33 90.96 244.33 195.24 170.34 121.5 138.08 153.66 212.07 227.4 107.44 227.4 107.44 272.87 426.85 272.87 426.85 227.4 322.22 227.4 396.21 153.66"/></svg></div><span class="age-linea"></span></div>
<script>
/* 2.18.8 · Entrada: se queda hasta que la pantalla terminó de cargar (sin esqueletos de carga, quieta y con la letra lista), al menos 0,9 s y como mucho 20 s (2.19.0; antes 7 s y en el servidor real se iba antes de los números).
   window.AgoraEntrada.mostrar() la vuelve a poner (al iniciar sesión). */
(function(){
  var el=document.getElementById('ag-entrada'),plantilla=el?el.outerHTML:'',ini=Date.now(),t=0,fin=0,mov=Date.now(),obs=null;
  /* 2.19.0 · la pantalla tiene que estar quieta (sin cambios en 0,4 s) además de sin esqueletos: así no se va antes de que se acomoden los números */
  function quieta(){var a=document.querySelector('main#app');if(!a)return false;if(!obs&&window.MutationObserver){obs=new MutationObserver(function(){mov=Date.now()});obs.observe(a,{childList:true,subtree:true,characterData:true})}return Date.now()-mov>400}
  function lista(){if(document.querySelector('#lg .lg-panel'))return true; /* la pantalla para entrar ya está */
    var a=document.querySelector('main#app');if(!a||!a.children.length)return false;
    if(document.querySelector('main#app [data-placeholder], main#app .sk:not([hidden])'))return false;return true}
  /* cada pieza va a la misma pieza del logo visible: el símbolo son sus tres primeras (aro y 2 rayos); el nombre del logo visible no se toca */
  function destino(){var c=document.querySelectorAll('#lg .home-brand-logo svg, #lg .lg-logo svg, #tb .brand svg, .launch-brand-logo svg, .home-brand-logo svg');
    for(var i=0;i<c.length;i++){var r=c[i].getBoundingClientRect();if(r.width>8&&r.height>8&&r.top>-r.height&&r.top<innerHeight)return c[i]}return null}
  function salir(){if(!el||el.classList.contains('is-sale'))return;var e=el,quieto=matchMedia('(prefers-reduced-motion: reduce)').matches,ent=!!document.querySelector('#lg .lg-panel');
    e.classList.add('is-sale');var fondo=e.querySelector('.age-fondo'),t=destino(),mias=e.querySelectorAll('svg :is(path,polygon)'),suyas=t?[].slice.call(t.querySelectorAll(':is(path,polygon)'),0,mias.length):[],dur=quieto?0:720,ultimo=0;
    function fin(){var a=e.animate([{opacity:1},{opacity:0}],{duration:quieto?220:160,fill:'forwards'});a.onfinish=function(){e.remove();if(el===e)el=null}}
    if(!t||quieto||suyas.length!==mias.length){fondo.animate([{opacity:1},{opacity:0}],{duration:quieto?220:420,fill:'forwards'});e.querySelectorAll('svg').forEach(function(x){x.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:quieto?220:380,fill:'forwards'})});setTimeout(function(){e.remove();if(el===e)el=null},quieto?240:440);return}
    var r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(var i=0;i<mias.length;i++){var m=mias[i],a=m.getBoundingClientRect(),b=suyas[i].getBoundingClientRect(),k=m.ownerSVGElement.getScreenCTM().a||1,esc=a.width?b.width/a.width:1,
        dx=((b.left+b.width/2)-(a.left+a.width/2))/k,dy=((b.top+b.height/2)-(a.top+a.height/2))/k,ret=i*35;ultimo=Math.max(ultimo,ret);
      var color=getComputedStyle(suyas[i]).fill;
      m.animate([{transform:'none'},{transform:'translate('+dx+'px,'+dy+'px) scale('+esc+')',fill:color&&color!=='none'?color:getComputedStyle(m).fill}],{duration:dur,delay:ret,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'})}
    if(ent)fondo.animate([{opacity:1},{opacity:0}],{duration:dur,delay:120,easing:'ease',fill:'forwards'}); // antes de iniciar sesión: el fondo se desvanece
    else{var R=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy));fondo.animate([{clipPath:'circle('+R+'px at '+cx+'px '+cy+'px)'},{clipPath:'circle(0px at '+cx+'px '+cy+'px)'}],{duration:dur+ultimo,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'})} // en la app: el fondo se recoge hacia el logo
    setTimeout(fin,dur+ultimo+40)}
  function vigilar(){clearInterval(t);clearTimeout(fin);ini=Date.now();var fuente=false;try{document.fonts.ready.then(function(){fuente=true})}catch(e){fuente=true}
    t=setInterval(function(){var pasado=Date.now()-ini;if(pasado<900)return;if((fuente&&lista()&&quieta())||pasado>20000){clearInterval(t);salir()}},120)}
  window.AgoraEntrada={mostrar:function(){if(el&&!el.classList.contains('is-sale')){vigilar();return}var d=document.createElement('div');d.innerHTML=plantilla;el=d.firstElementChild;document.body.appendChild(el);vigilar()},salir:salir};
  vigilar();
})();
</script>

<script>
/* 2.19.0 · Que la caché nunca deje una versión vieja: si el navegador abrió una página guardada de otra versión,
   se borran las copias guardadas y se recarga una sola vez con la nueva. */
(function(){var V='2.19.0';try{fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(!d||!d.version||d.version===V)return;var k='agora.recarga.'+d.version;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){return}
  var borrar=window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(x){return caches.delete(x)}))}):Promise.resolve();
  var sw=navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.update().catch(function(){})}))}):Promise.resolve();
  Promise.all([borrar,sw]).catch(function(){}).then(function(){location.reload()});
}).catch(function(){})}catch(e){}})();
/* El trabajador de servicio: el mismo de Ágora, con la caché de esta versión.
   Se encarga de los avisos (push) y de abrir la conversación al tocarlos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
