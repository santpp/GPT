<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Factura · Ágora</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--ink:#1d1b22;--muted:#5b6170;--line:#e5e4e9;--vino:#ad103c;--bg:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Helvetica,Arial,system-ui,sans-serif}
header{max-width:900px;margin:0 auto;padding:20px 16px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:34px;width:auto}header div{flex:1;min-width:180px}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;color:var(--muted);font-size:13px}
button{border:0;border-radius:999px;background:var(--vino);color:#fff;font:600 14px Helvetica,Arial,sans-serif;padding:10px 18px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:8px 16px 32px}
iframe{width:100%;min-height:80vh;border:1px solid var(--line);border-radius:16px;background:#fff}
.aviso{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
@media print{header{display:none}main{padding:0}iframe{border:0;min-height:0}}
</style>
<header><img src="/assets/correo/agora-logo-correo.png" alt="Ágora"><div><h1 id="t">Tu factura</h1><p id="s">Cargando…</p></div><button type="button" id="imp" hidden>Imprimir o guardar en PDF</button></header>
<main id="m"><p class="aviso">Cargando la factura…</p></main>
<script src="/assets/factura-publica.js"></script>
</html>
